<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF9F6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Solver's Notebook" />
<title>Solver's Notebook — Sudoku</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app" id="app">

  <!-- Header: minimal, just status -->
  <header class="titlebar">
    <span class="difficulty-tag" id="difficultyDisplay">Medium</span>
    <span class="mistakes" id="mistakesDisplay" title="Mistakes">0 ✕</span>
    <span class="timer" id="timerDisplay">00:00</span>
  </header>

  <main class="layout">

    <!-- Puzzle column: board takes majority of space -->
    <section class="puzzle-col">
      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Sudoku board">
          <div class="board-grid" id="boardGrid"></div>
          <div class="box-line box-line-v" style="left:33.3333%"></div>
          <div class="box-line box-line-v" style="left:66.6667%"></div>
          <div class="box-line box-line-h" style="top:33.3333%"></div>
          <div class="box-line box-line-h" style="top:66.6667%"></div>
        </div>
      </div>
    </section>

    <!-- Control rail: icon-only tools + numpad -->
    <aside class="panel">

      <div class="icon-row" id="iconRow">
        <button class="icon-tool" id="settingsBtn" title="New puzzle / difficulty" aria-label="New puzzle and difficulty">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="icon-tool" id="undoBtn" title="Undo" aria-label="Undo">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button class="icon-tool" id="eraseBtn" title="Erase" aria-label="Erase cell">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 19"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        </button>
        <button class="icon-tool" id="hintBtn" title="Hint" aria-label="Get a hint">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.6.5 1 1.3 1 2.1V16h6v-.4c0-.8.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg>
        </button>
        <button class="icon-tool" id="checkBtn" title="Check board" aria-label="Check board for conflicts">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
      </div>

      <div class="hint-output" id="hintOutput"></div>

      <div class="input-row">
        <div class="mobile-numpad" id="mobileNumpad"></div>

        <div class="mode-rail" id="modeRail">
          <button class="mode-btn active" data-mode="digit" title="Enter digit" aria-label="Enter final digit">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/>
              <text x="12" y="16.5" text-anchor="middle" font-size="11" font-family="inherit" font-weight="700" stroke="none" fill="currentColor">5</text>
            </svg>
          </button>
          <button class="mode-btn" data-mode="corner" title="Corner notes" aria-label="Corner pencil marks">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/>
              <circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/>
              <circle cx="16.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/>
              <circle cx="7.5" cy="16.5" r="1.3" fill="currentColor" stroke="none"/>
              <circle cx="16.5" cy="16.5" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
          </button>
          <button class="mode-btn" data-mode="center" title="Center notes" aria-label="Center pencil marks">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/>
              <circle cx="9.3" cy="12" r="1.3" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>
              <circle cx="14.7" cy="12" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
          </button>
          <button class="mode-btn" data-mode="color" title="Shade cell" aria-label="Shade cell with color">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3c4 5 6.5 8.2 6.5 11.2A6.5 6.5 0 0 1 5.5 14.2C5.5 11.2 8 8 12 3Z"/>
            </svg>
          </button>
        </div>
      </div>

    </aside>

  </main>

  <!-- Settings popover: difficulty + new puzzle -->
  <div class="popover-backdrop" id="settingsBackdrop">
    <div class="popover" id="settingsPopover">
      <div class="difficulty-grid" id="difficultyGrid">
        <button class="chip" data-diff="easy">Easy</button>
        <button class="chip" data-diff="medium">Medium</button>
        <button class="chip" data-diff="hard">Hard</button>
        <button class="chip" data-diff="expert">Expert</button>
      </div>
      <button class="btn primary" id="newPuzzleBtn">Start new puzzle</button>
    </div>
  </div>

  <!-- Win overlay -->
  <div class="overlay" id="winOverlay">
    <div class="overlay-card">
      <p class="overlay-eyebrow">Solved</p>
      <h2 id="winTime">00:00</h2>
      <p id="winMistakes">0 mistakes</p>
      <button class="btn primary" id="winNewBtn">New puzzle</button>
    </div>
  </div>

  <!-- Install prompt -->
  <div class="install-banner" id="installBanner">
    <span>Add Solver's Notebook to your home screen for the full app feel.</span>
    <button id="installBtn" class="btn small">Install</button>
    <button id="dismissInstall" class="icon-btn small" aria-label="Dismiss">✕</button>
  </div>

</div>

<script src="sudoku-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
